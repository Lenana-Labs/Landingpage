<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d6d8d9" />
      <stop offset="40%" stop-color="#b8babd" />
      <stop offset="75%" stop-color="#8a8d91" />
      <stop offset="100%" stop-color="#55585b" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#e8e9eb" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="ridgeLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#707478" />
      <stop offset="100%" stop-color="#3c3f42" />
    </linearGradient>
    <linearGradient id="ridgeShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2c2e" />
      <stop offset="100%" stop-color="#111314" />
    </linearGradient>
    <linearGradient id="peakLight" x1="30%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8c9196" />
      <stop offset="60%" stop-color="#52565a" />
      <stop offset="100%" stop-color="#2a2d30" />
    </linearGradient>
    <linearGradient id="snowGlint" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f0f2f5" />
      <stop offset="100%" stop-color="#a4a8ad" />
    </linearGradient>
    <pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.5" fill="#000000" opacity="0.1" />
      <circle cx="65" cy="40" r="0.75" fill="#ffffff" opacity="0.1" />
      <circle cx="45" cy="80" r="0.6" fill="#000000" opacity="0.08" />
      <circle cx="85" cy="15" r="0.5" fill="#000000" opacity="0.12" />
      <circle cx="10" cy="70" r="0.8" fill="#ffffff" opacity="0.1" />
    </pattern>
  </defs>

  <!-- Sky Base -->
  <rect width="2400" height="1350" fill="url(#skyGrad)" />

  <!-- Atmospheric High Altitude Cloud Layers -->
  <path d="M0,280 Q400,200 900,250 T1800,210 Q2150,230 2400,190 L2400,450 L0,480 Z" fill="url(#cloudGrad)" />
  <path d="M0,150 Q600,100 1200,180 T2400,130 L2400,320 L0,320 Z" fill="url(#cloudGrad)" opacity="0.5" />
  
  <!-- Subtle Topographical Elevation Iso-Lines across the background -->
  <g stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.18" fill="none">
    <path d="M0,500 C400,460 750,540 1200,490 C1650,440 2000,470 2400,420" />
    <path d="M0,540 C420,510 780,580 1240,530 C1700,480 2050,510 2400,460" />
    <path d="M0,590 C450,560 810,630 1280,570 C1750,520 2100,550 2400,510" />
    <path d="M600,680 C950,640 1350,680 1750,620 C2050,580 2250,600 2400,570" />
  </g>

  <!-- Distant Mountain Ridges (Batian / Nelion distant silhouettes) -->
  <polygon points="650,780 920,580 1150,720 1420,520 1720,740 1900,630 2400,820 2400,1350 650,1350" fill="#4b4f53" />

  <!-- Mid-distance Glacial Crests & Crags -->
  <polygon points="980,820 1260,560 1480,720 1780,480 1960,650 2220,540 2400,680 2400,1350 980,1350" fill="url(#ridgeLight)" />
  <!-- Shadow facets on mid-distance ridge -->
  <polygon points="1260,560 1340,680 1480,720 1360,780 1260,560" fill="url(#ridgeShadow)" />
  <polygon points="1780,480 1880,600 1960,650 1850,710 1780,480" fill="url(#ridgeShadow)" />

  <!-- Point Lenana Peak Formations (Hero Focus - Dominant in Columns 7 to 12) -->
  <!-- Left rock shoulder of Lenana -->
  <polygon points="1250,1350 1380,780 1520,620 1680,690 1720,850 1550,1350" fill="#2d3033" />
  <polygon points="1520,620 1620,760 1680,690" fill="url(#snowGlint)" opacity="0.65" />

  <!-- Main Summit Spire of Point Lenana (Sharp, dramatic, pyramidal) -->
  <!-- Lit eastern facet -->
  <polygon points="1640,1350 1750,780 1880,310 1980,590 2060,750 2150,1350" fill="url(#peakLight)" />
  <!-- Shadow western precipice facet -->
  <polygon points="1580,1350 1690,840 1880,310 1750,780 1640,1350" fill="url(#ridgeShadow)" />
  
  <!-- Snow & Glacier gullies on Point Lenana Summit -->
  <polygon points="1880,310 1870,390 1895,440 1880,510 1910,580 1930,550 1905,480 1890,390" fill="url(#snowGlint)" />
  <polygon points="1980,590 2000,640 1985,710 1960,660 1970,620" fill="url(#snowGlint)" opacity="0.8" />
  <polygon points="1790,680 1820,740 1805,790 1775,730" fill="url(#snowGlint)" opacity="0.7" />

  <!-- Deep Crags and Couloirs (High contrast black fissures) -->
  <polyline points="1880,310 1860,450 1830,580 1800,720 1760,890 1710,1100" stroke="#0e1011" stroke-width="6" stroke-linecap="round" fill="none" />
  <polyline points="1880,310 1920,440 1960,570 2010,730 2070,920" stroke="#0e1011" stroke-width="4" stroke-linecap="round" fill="none" />
  <polyline points="1860,450 1890,520 1870,630" stroke="#0e1011" stroke-width="3" fill="none" />
  
  <!-- Secondary Rugged Ridge on Far Right (Columns 10-12) -->
  <polygon points="1980,1350 2080,720 2210,460 2340,640 2400,600 2400,1350" fill="url(#peakLight)" />
  <polygon points="2080,720 2160,820 2210,460" fill="url(#ridgeShadow)" />
  <polyline points="2210,460 2190,600 2150,780 2120,980" stroke="#0e1011" stroke-width="5" fill="none" />

  <!-- Scree and Basal Rocks -->
  <polygon points="1100,1350 1350,960 1620,1020 1850,920 2100,1050 2400,980 2400,1350" fill="#181a1c" />
  <polygon points="0,1350 0,980 400,920 800,1020 1150,970 1450,1150 1100,1350" fill="#202326" />
  
  <!-- Mountain Plateau Contour Lines at lower section -->
  <g stroke="#ffffff" stroke-width="1" stroke-opacity="0.1" fill="none">
    <path d="M1200,1050 Q1600,980 2000,1080 T2400,1020" />
    <path d="M1100,1120 Q1550,1060 1950,1150 T2400,1110" />
    <path d="M1000,1200 Q1500,1140 1900,1230 T2400,1190" />
  </g>

  <!-- Grain Overlay for Film Photography Texture -->
  <rect width="2400" height="1350" fill="url(#grain)" />

  <!-- Coordinates & Elevation Watermark (Swiss technical precision) -->
  <text x="2320" y="80" text-anchor="end" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="3" fill="#ffffff" opacity="0.45">POINT LENANA — 4,985M / 0°09'S 37°18'E</text>
  <line x1="1950" y1="95" x2="2320" y2="95" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" />
</svg>
